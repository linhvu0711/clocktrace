name: ci

# Runs only when started by hand from the Actions tab. The same gates run on
# every push through the pre-push hook in .githooks, which pnpm install turns
# on, so a red branch never reaches GitHub in the first place.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
